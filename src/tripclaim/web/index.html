<script>
// Decide before anything renders: no valid login -> straight to the Cognito login page.
(function () {
  const cfg = window.TRIPCLAIM || {auth: false};
  window.loginUrl = () => `https://${cfg.domain}/login?client_id=${cfg.clientId}&response_type=token&scope=openid+email&redirect_uri=${encodeURIComponent(location.origin + "/")}`;
  window.logoutUrl = () => `https://${cfg.domain}/logout?client_id=${cfg.clientId}&logout_uri=${encodeURIComponent(location.origin + "/")}`;
  if (!cfg.auth) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("id_token")) { sessionStorage.setItem("idt", h.get("id_token")); history.replaceState(null, "", "/"); }
  const t = sessionStorage.getItem("idt");
  let valid = false;
  try { valid = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000 > Date.now() + 30000; } catch (e) {}
  if (!valid) {
    sessionStorage.removeItem("idt");
    window.redirecting = true;
    document.documentElement.style.display = "none";
    location.replace(window.loginUrl());
  }
})();
</script>

function auditText(x) {

  const bits = [];
  if (d && d.type && "amount_usd" in d) bits.push(`${tr("dec_" + d.type)} ${money(d.amount_usd)}${d.estimate_usd != null ? ` (${tr("amount_est")} ${money(d.estimate_usd)})` : ""}`);
  if (d && (d.clauses || []).length) bits.push(d.clauses.join(", "));
  if (a.why) bits.push(`${tr("pending_why")}: ${a.why.map(w => tr("why_" + w)).join(", ")}`);
  if (a.requested_by) bits.push(`${tr("requested_by")} ${a.requested_by}`);
  if (x.before && typeof x.before === "string") bits.push(`${STATUS[lang][x.before] || x.before} → ${STATUS[lang][a] || (typeof x.after === "string" ? STATUS[lang][x.after] || x.after : "")}`);
  if (a.doc) bits.push(`${tr("doc")} ${a.doc}`);
  if (a.assignee) bits.push(`${tr("owner")} ${a.assignee}`);
  if (a.topic) bits.push(`${tr("ct_" + a.topic)} · ${tr("cr_" + a.result)}`);
  if (a.to && x.action !== "bedrock_fallback") bits.push(`→ ${who(a.to)}${a.due ? ` · ${tr("by_when")} ${new Date(a.due).toLocaleString()}` : ""}`);
  if (a.phone) bits.push(`${tr("new_phone").replace(/\s*\(.*$/, "")} ${a.phone}`);
  if (a.restored) bits.push(`${tr("payto")} ${a.restored.bank || ""} •••${a.restored.account_last4 || ""}`);
  if (a.sent != null) bits.push(`${tr("audit_sent")} ${a.sent}`);
  if (a.count != null) bits.push(`${tr("audit_sent")} ${a.count}`);
  if (x.identity_check) bits.push(`${tr("identity")}: ${x.identity_check}`);
  if (x.action === "wording_blocked" || x.action === "agent_wording_blocked" || x.action === "wording_after_send")  // what was stopped, and where
    bits.push(`“${[a.phrase, ...(a.phrases || [])].filter(Boolean).join(", ")}”${a.where ? ` · ${a.where}` : ""}${a.text ? ` — ${a.text.slice(0, 60)}${a.text.length > 60 ? "…" : ""}` : ""}`);
  if (x.action === "bedrock_fallback")  // where this claim's data was processed, readable for a compliance report
    bits.push(tr("fb_detail").replace("{via}", a.processed_via || "").replace("{call}", tr("fb_" + a.call) || a.call || "").replace("{from}", a.from || "").replace("{to}", a.to || ""));
  if (x.action === "callback_requested" && a.pref)
    bits.push(cbLocal(a).replace(/^\s*(?:· )?/, "") + (a.due ? ` · ${tr("callback_badge")} ${shortWhen(a.due)}` : ""));
  if (x.takeover_reason) bits.push(`${tr("takeover_reason")}: ${x.takeover_reason}`);
  if (x.reason) bits.push(`${tr(x.action === "decision_requested" ? "decision_reason" : x.action === "siu_referred" ? "siu_reason" : "approved_despite")}: ${x.reason}`);

  if (x.override) bits.push(`⚠ ${tr("basis_override")}: ${x.override}`);

  return bits.filter(Boolean).join(" · ");
}

  const name = m.replace(/^claude-([a-z]+)-(\d+)-(\d+).*/, (_, f, a, b) => `Claude ${f[0].toUpperCase() + f.slice(1)} ${a}.${b}`);

    <div class="tiles">

      ${tile(tr("k_blocked"), bl.staff + bl.agent, tr("k_blocked_sub").replace("{s}", bl.staff).replace("{a}", bl.agent)

      ${tile(tr("k_regex_only"), bl.regex_only ?? 0, tr("k_regex_only_sub")).replace('class="tile', bl.regex_only ? 'class="tile alarm' : 'class="tile')}

      ${tile(tr("k_sms"), m.sms, `${tr("k_parts")} ${m.sms_parts} · $${m.cost_usd.toFixed(2)}`)}

    <p class="muted">${tr("k_note")}</p>`;

async function kpiCsv() {  // per disruption, for the period on screen; the export itself is in the audit trail
  const k = await api(`/api/kpi?days=${kpiDays}&export=1`); if (k.error) return;
  const head = ["event", "claims", "opened", "submitted", "full", "partial", "denied", "open_checks", "to_submit_h", "to_decide_h"];
  const rows = [["basis", k.period.basis, k.period.from, k.period.to], [], head, ...k.events.map(e => head.map(h => e[h] ?? ""))];
  rows.push([], ["day", ...k.days], ...["created", "submitted", "decided"].map(s => [s, ...k.series[s]]));
  const c = k.control || {};  // backlog: every open item, whatever the period
  rows.push([], ["backlog_now", "all claims"], ["appeals_open", c.appeals_open], ["appeals_overdue", c.appeals_overdue], ["pending_second_review", c.pending], ["callbacks_open", c.callbacks]);
  rows.push([], ["blocked_staff", k.blocked.staff], ["blocked_ai", k.blocked.agent], ...Object.entries(k.blocked.by_person).map(([p, n]) => ["blocked_by", p, n]));
  const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type: "text/csv"}));
  a.download = `tripclaim-kpi-${k.days[0]}_${k.days.at(-1)}.csv`; a.click();
}
