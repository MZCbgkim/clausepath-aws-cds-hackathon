<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ClausePath</title>
<style>
  :root { --ink:#1b2230; --muted:#5b6474; --line:#e3e6ee; --blue:#1f4fd8; --bg:#f4f6fa; }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; display:flex; flex-direction:column; font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); background:var(--bg) }
  header { padding:.8rem 1rem; background:#fff; border-bottom:1px solid var(--line) }
  header b { color:var(--blue); font-size:16px } header .sub { display:block; color:var(--muted); font-size:13.5px; line-height:1.3 }
  .hrow { display:flex; align-items:center; gap:.6rem } .who { display:flex; align-items:center; gap:.5rem; min-width:0; flex:1 }
  .shield { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:#e8eeff; color:var(--blue); flex-shrink:0 }
  .shield svg.ln { width:18px; height:18px; vertical-align:0 }
  .call { display:flex; align-items:center; gap:.35rem; height:36px; padding:0 .75rem; border-radius:18px; background:#eef2ff; color:var(--blue); font-size:14px; font-weight:600; text-decoration:none; white-space:nowrap }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100% }
  .prog { display:flex; align-items:center; gap:.6rem; width:100%; margin-top:.45rem; padding:.3rem 0; background:none; text-align:left; color:var(--ink) }
  .prog .pl { font-size:14px; font-weight:600; white-space:nowrap } .prog .pv { color:var(--muted); font-size:13px }
  .progress { flex:1; height:6px; background:var(--line); border-radius:3px } .progress i { display:block; height:100%; background:var(--blue); border-radius:3px; width:0; transition:width .4s }
  #offline { background:#fff4e5; color:#8a4b00; font-size:14.5px; padding:.5rem 1rem; border-bottom:1px solid #ffe0b2 }
  #cl { position:fixed; inset:auto 0 0 0; max-height:80vh; overflow:auto; z-index:10; background:#fff; border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(20,30,60,.25); padding:.4rem 1rem 1.2rem }
  #cl[hidden] { display:none } .clh { display:flex; align-items:center; justify-content:space-between; padding:.6rem 0; font-size:17px }
  .clh button { width:40px; height:40px; border-radius:50%; background:#f1f4fb; font-size:16px }
  .ci { display:flex; gap:.7rem; align-items:flex-start; padding:.7rem 0; border-top:1px solid var(--line); font-size:16px }
  .est.deny { background:#fdf0ef; border-color:#f3c5c0 } .est.deny .ev { color:#b42318 }
  .appeal { display:grid; gap:.4rem; margin-top:.5rem } .appeal textarea { width:100%; font:inherit; padding:.5rem; border-radius:10px; border:1px solid var(--line) }
  .callbtn { display:flex; align-items:center; justify-content:center; gap:.4rem; min-height:44px; border-radius:12px; background:#fff; border:1px solid var(--line); color:var(--blue); font-weight:600; text-decoration:none }
  .letter { display:flex; align-items:center; justify-content:center; gap:.35rem; margin-top:.6rem; min-height:44px; border:1.5px solid var(--blue); border-radius:12px; color:var(--blue); font-size:15px; font-weight:600; text-decoration:none; background:#fff }
  .nw { white-space:nowrap }  /* an amount and its won value never split across lines (large text) */
  .apnote { background:#ecfdf3; color:#0f6b4a; border-radius:8px; padding:.35rem .55rem; margin:0 0 .5rem; font-size:.9em; font-weight:600 }
  .es.myap { background:#fff; border-radius:10px; padding:.45rem .6rem; color:var(--ink) }
  .linkbtn { display:block; margin:.5rem auto 0; border:0; background:none; color:var(--muted); text-decoration:underline; font-size:14px; min-height:40px }
  #ev .bar button span.bl, #ev .bar a span.bl { font-size:12.5px }
  .es.split { background:#fff; border-radius:10px; padding:.45rem .6rem; color:var(--ink) }
  .callreq { margin:.9rem 0 .2rem; text-align:center } .callreq button { width:100%; min-height:46px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:15px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:.4rem }
  .callreq button[disabled] { color:#0f6b4a; border-color:#a6dcc4; background:#f0fbf6 } .callreq small { display:block; margin-top:.3rem; color:var(--muted) }
  .callreq .cbw:not([hidden]) { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem } .callreq .cbw small { width:100%; margin:0 } .callreq .cbw button { flex:1; width:auto; min-height:44px; font-size:14px }
  .wbtn { width:100%; min-height:44px; margin-top:.5rem; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:15px; font-weight:600 }
  .callreq .cbwhen { display:block; margin-top:.4rem; color:var(--ink); font-weight:600 }
  .callreq .cbx { width:100%; min-height:44px; margin-top:.5rem; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:15px; font-weight:600 }
  #apm { display:block; color:#b42318; font-size:15px; font-weight:600; margin:.3rem 0 }
  .cltext { background:#fff; border-radius:10px; padding:.8rem .9rem; margin:0 0 .5rem; font-size:17px; line-height:1.6; white-space:pre-wrap; box-shadow:0 1px 4px rgba(0,0,0,.08) }
  .letter.inl { display:inline-flex; padding:0 .9rem; margin:.2rem 0 }
  .clref { display:inline; padding:0 .3rem; border:0; border-radius:6px; background:#ede9fe; color:var(--blue); font:inherit; font-weight:600; text-decoration:underline dotted; cursor:pointer }
  .blk { display:inline-block; color:var(--blue); font-size:.92em } .es.appealed { color:#0f6b4a; font-weight:600 }
  .er { margin:.35rem 0; font-size:14px } .er summary { cursor:pointer; color:#0f6b4a; font-weight:600 }
  .er div { display:flex; justify-content:space-between; gap:.6rem; padding:.2rem 0; border-bottom:1px dashed #cfe8dc }
  .er div span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .er small { color:var(--muted) }
  .langsw { margin:.6rem 0 0; font-size:14px; color:var(--muted) } .langsw button { background:none; border:0; padding:.3rem .2rem; color:var(--blue); font-size:14px; cursor:pointer }
  .langsw button.on { color:var(--ink); font-weight:700; text-decoration:underline }
  .sentph { white-space:normal; line-height:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:6px; max-width:260px }
  .sp { position:relative; padding:0; border:0; border-radius:10px; overflow:hidden; aspect-ratio:1; background:#dfe5f5; cursor:zoom-in }
  .sp img { width:100%; height:100%; object-fit:cover; display:block } .sp.retake, .sp.check { outline:3px solid #f59e0b; outline-offset:-3px }
  .sp.reading span { background:rgba(31,79,216,.88) } .sp.reading img { opacity:.75 }
  .sp span { position:absolute; left:0; right:0; bottom:0; padding:2px 4px; background:rgba(180,83,9,.92); color:#fff; font-size:11px; line-height:1.3 }
  #lightbox { position:fixed; inset:0; z-index:30; background:rgba(10,14,25,.88); display:grid; place-items:center; padding:12px }
  #lightbox img { max-width:100%; max-height:100%; border-radius:6px }
  .ci .b { width:26px; height:26px; flex-shrink:0; border-radius:50%; display:grid; place-items:center; font-size:14px; background:#eef1f7; color:var(--muted) }
  .ci.done .b { background:#e3f5ee; color:#0f8a5f } .ci small { display:block; color:var(--muted); font-size:14px; margin-top:.15rem } .ci small.w { color:#b45309 }
  .ci a { display:inline-block; margin-top:.4rem; padding:.45rem .9rem; border-radius:10px; background:#eef2ff; color:var(--blue); text-decoration:none; font-size:15px }
  .est { margin:.2rem 0 .6rem; padding:.8rem .9rem; border-radius:14px; background:linear-gradient(135deg,#eefaf4,#f6fdf9); border:1px solid #cdeedd }
  .est .el { font-size:13.5px; color:#0b6b49; font-weight:600 } .est .ev { font-size:26px; font-weight:800; color:#0b6b49; line-height:1.2 }
  .est .ev small { font-size:15px; font-weight:600; margin-left:.4rem; color:#2f7d5d } .est .es { font-size:13.5px; color:var(--muted); margin-top:.2rem }
  .bigbtn { display:block; width:100%; margin-top:1rem; height:52px; border-radius:14px; background:var(--blue); color:#fff; font-size:17px; font-weight:600 }
  .bigbtn:disabled { background:#c9d1e6 } .clnote { color:var(--muted); font-size:14.5px; margin-top:.6rem }
  .ready { display:flex; align-items:center; gap:.6rem; margin:0 0 .5rem; padding:.55rem .7rem; border-radius:14px; background:#e3f5ee; color:#0b6b49; font-size:15px }
  .ready button { white-space:nowrap; flex-shrink:0; margin-left:auto; height:38px; padding:0 1rem; border-radius:10px; background:#0f8a5f; color:#fff; font-weight:600; font-size:15px }
  .intro { flex-shrink:0; align-self:stretch; padding:.85rem .95rem; border-radius:16px; background:linear-gradient(135deg,#eef3ff,#f7f9ff); border:1px solid #dbe4ff; font-size:15px; line-height:1.5 }
  .intro b { color:var(--blue) } .intro .ev { font-size:16px; font-weight:700; margin-bottom:.35rem; display:flex; align-items:center; gap:.4rem }
  .intro .plan { margin:.4rem 0; padding:.5rem .65rem; border-radius:12px; background:#fff; border:1px solid #e3e8f8 }
  .intro .plan small { display:block; color:var(--muted); font-size:13.5px }
  .intro ol { margin:.35rem 0 .2rem; padding-left:1.3rem } .intro .muted { color:var(--muted); font-size:13.5px }
  .ready.sent { background:#eef2ff; color:#1f3fa8 } .ready.sent button { background:#fff; color:var(--blue); border:1px solid #c9d6ff }
  .ready[hidden] { display:none } .sendfail { align-self:flex-end; color:#b42318; font-size:14.5px } .sendfail button { margin-left:.4rem; padding:.3rem .7rem; border-radius:8px; background:#fde8e7; color:#b42318 }
  #log { flex:1; overflow:auto; padding:1rem; display:flex; flex-direction:column; gap:.6rem }
  .livewrap { display:contents }  /* the live trail and its source card sit in the chat column like the rest */
  .m { max-width:86%; padding:.6rem .8rem; border-radius:14px; white-space:pre-wrap; word-break:break-word }
  .m.out { background:#fff; border:1px solid var(--line); align-self:flex-start; border-top-left-radius:4px }
  .m.in { background:var(--blue); color:#fff; align-self:flex-end; border-top-right-radius:4px }
  .m .via { display:block; font-size:13px; color:var(--muted); margin-bottom:.15rem }
  .m.in .via { color:#dbe4ff }
  .m a { color:inherit } .m a.btn { display:inline-block; margin:.3rem 0; padding:.35rem .8rem; border-radius:16px; background:var(--blue); color:#fff; text-decoration:none }
  button { font:inherit; cursor:pointer; border:0 }
  svg.ln.flip { transform:scaleX(-1) } [hidden] { display:none !important }  /* component styles must not resurrect hidden elements */
  svg.ln { width:1.1em; height:1.1em; flex-shrink:0; vertical-align:-.18em }
  .tile { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; background:var(--tb,#eef2ff); color:var(--tf,#1f4fd8) }
  .tile svg.ln { width:15px; height:15px; vertical-align:0 }
  .t-read,.t-doc { --tb:#fff4e0; --tf:#b45309 } .t-search,.t-found { --tb:#e8f0ff; --tf:#1f4fd8 } .t-check { --tb:#e6f6ef; --tf:#0f8a5f }
  .t-verdict { --tb:#f1e9ff; --tf:#7c3aed } .t-cite { --tb:#fff7cc; --tf:#a16207 } .t-secure { --tb:#eef0f4; --tf:#374151 }
  .t-bad { --tb:#fde8e7; --tf:#b42318 }
  .spin { width:26px; height:26px; flex-shrink:0; display:grid; place-items:center } .spin::after { content:""; width:14px; height:14px; border-radius:50%;
          border:2px solid #c7d4ff; border-top-color:var(--blue); animation:spin .8s linear infinite }
  .ok { color:#0f8a5f } .warn { color:#b45309 }
  /* live agent trail: what ClausePath is doing while the traveler waits */
  .trail { align-self:flex-start; width:86%; max-width:520px; flex-shrink:0; padding:.65rem .8rem; border-radius:14px; border-top-left-radius:4px;
           background:linear-gradient(135deg,#f5f8ff,#eef3ff); border:1px solid #dbe4ff; font-size:15px }
  .trail .hdr { display:flex; align-items:center; gap:.45rem; font-weight:600; color:var(--blue); margin-bottom:.35rem }
  .trail .orb { width:10px; height:10px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 0 rgba(31,79,216,.5); animation:orb 1.4s infinite }
  @keyframes orb { 70% { box-shadow:0 0 0 8px rgba(31,79,216,0) } 100% { box-shadow:0 0 0 0 rgba(31,79,216,0) } }
  .trail ol { list-style:none; margin:0; padding:0 }
  .trail li { display:flex; gap:.5rem; padding:.18rem 0; color:var(--ink); animation:rise .35s ease-out both }
  .trail li { align-items:flex-start } .trail li .x { padding-top:2px } .trail li .x { min-width:0; overflow-wrap:anywhere }
  .trail li .x small { color:var(--muted) } .trail li.now .x { color:var(--muted) } .trail li.now .el { font-variant-numeric:tabular-nums }

  @keyframes rise { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:none } }
  @keyframes spin { to { transform:rotate(360deg) } }
  .trail.done { background:#fff; border-color:var(--line); padding:.4rem .75rem; font-size:14.5px; margin-top:-.3rem }
  .trail.done .hdr { margin:0; font-weight:500; color:var(--muted); cursor:pointer } .trail.done .hdr .tog { transition:transform .15s }
  .trail.done:not(.open) ol { display:none } .trail.done.open .hdr { margin-bottom:.3rem } .trail.done.open .hdr .tog { transform:rotate(90deg) }
  .trail.done li { animation:none }
  /* composer */
  .dock { background:rgba(255,255,255,.92); backdrop-filter:saturate(1.4) blur(10px); border-top:1px solid var(--line); padding:.5rem .6rem; padding-bottom:max(.5rem, env(safe-area-inset-bottom)) }
  .chips[hidden] { display:none } .chips { display:flex; gap:.4rem; overflow-x:auto; padding:0 .1rem .5rem; scrollbar-width:none } .chips::-webkit-scrollbar { display:none }
  .chips button { flex-shrink:0; height:38px; padding:0 .8rem; border-radius:16px; background:#fff; border:1px solid #d6def5; color:var(--blue); font-size:14.5px; white-space:nowrap }
  .chips button:active { background:#eef2ff }
  .box { display:flex; flex-direction:column; border:1.5px solid var(--line); border-radius:24px; background:#fff; transition:border-color .15s, box-shadow .15s }
  .box:focus-within { border-color:var(--blue); box-shadow:0 0 0 4px rgba(31,79,216,.10) }
  .thumbs { display:flex; gap:.4rem; padding:.5rem .6rem 0; overflow-x:auto } .thumbs:empty { display:none }
  .thumbs .th { position:relative; flex-shrink:0; width:56px; height:56px; border-radius:10px; background:#eef1f7 center/cover }
  .thumbs .th button { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#1b2230; color:#fff; font-size:12px; line-height:20px; padding:0 }
  .row { display:flex; align-items:flex-end; gap:.25rem; padding:.25rem }
  .row textarea { flex:1; resize:none; border:0; outline:0; background:transparent; font:inherit; line-height:1.4; padding:.55rem .3rem; max-height:132px; min-height:40px; height:40px }
  .row textarea::placeholder { color:#9aa3b2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .ic { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; background:transparent; color:var(--muted) }
  .ic:hover { background:#f1f4fb } .ic svg { width:22px; height:22px }
  #cam { display:flex; align-items:center; gap:.3rem; height:40px; padding:0 .7rem; border-radius:20px; background:#eef2ff; color:var(--blue); font-size:14.5px; font-weight:600; flex-shrink:0 }
  #cam svg.ln { width:19px; height:19px; vertical-align:0 }
  .big-text { zoom:1.3 } .big-text #readyt .sec, #readyt .bigonly { display:none } .big-text #readyt .bigonly { display:inline }  /* big text: the bar keeps amount and date (two lines); won and review are on the card above */  /* "가+" in the header: everything larger, for travelers who need it */
  .who > div { min-width:0 } .big-text header .sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }  /* one row: "공식 청구 도우미" stays, the call button keeps its word */
  .tsize[aria-pressed="true"] { background:var(--blue); color:#fff }
  .tsize { height:36px; min-width:36px; padding:0 .5rem; border-radius:18px; background:#f1f4fb; color:var(--ink); font-weight:700; font-size:14px }
  #send { background:var(--blue); color:#fff; transition:transform .1s, opacity .15s } #send:disabled { opacity:.35; cursor:default } #send:not(:disabled):active { transform:scale(.92) }
  #send svg { width:20px; height:20px }
  .note { text-align:center; color:var(--muted); font-size:13px; padding:.4rem .5rem 0 }
  /* source cards: the passage a reply rests on, cut from the original PDF page */
  .card { flex-shrink:0; align-self:flex-start; width:86%; max-width:520px; margin-top:-.3rem; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden }
  .card .hd { display:flex; align-items:center; gap:.4rem; width:100%; min-height:44px; padding:.45rem .7rem; background:#f7f9fd; color:var(--ink); font-size:14.5px; text-align:left; cursor:pointer }
  .card .hd .srcs { flex:1; min-width:0; padding:0 }
  .card .hd .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .card .hd b { color:var(--blue) }
  .card .hd .tog { color:var(--muted); transition:transform .15s } .card.fold .hd .tog { transform:rotate(-90deg) }
  .card .srcs { display:flex; gap:.3rem; flex-wrap:wrap; padding:.45rem .6rem 0 }
  .card .src { height:36px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 .7rem; border-radius:18px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:14px }
  .card .src.on { background:var(--blue); border-color:var(--blue); color:#fff }
  .ref { display:inline-block; min-width:1.35em; height:1.35em; padding:0 .25em; margin:0 .1em; border:0; border-radius:.4em; background:#e6ecff; color:var(--blue); font:600 .72em/1.35em system-ui,sans-serif; vertical-align:.35em; cursor:pointer }
  .ref.on { background:var(--blue); color:#fff } .nw { white-space:nowrap }
  .card .cap { padding:.45rem .75rem 0; font-size:15.5px } .card .cap { border-left:3px solid #f5c400; margin:.5rem .75rem 0; padding:.1rem .6rem }
  .card .crop { margin:.4rem .5rem 0; max-height:60vh; overflow-y:auto; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:zoom-in }
  .card .seg { position:relative; overflow:hidden; height:0 } .card .seg + .seg { border-top:1px dashed var(--line) }
  .card .seg .pg { position:absolute }
  @media (max-width:700px) { .card { width:100% } }  /* phones: every pixel goes to the passage */
  .card .acts { display:flex; gap:.15rem; flex-shrink:0; align-self:flex-start }
  .card .acts button, .card .acts a { width:36px; height:36px; padding:0; border-radius:9px; border:0; background:none; color:var(--muted); display:inline-flex; align-items:center; justify-content:center }
  .card .acts button:hover, .card .acts a:hover { background:#e9eef8; color:var(--blue) }
  .card .hd .tog { align-self:flex-start; height:36px; display:inline-flex; align-items:center }
  .card .crop { margin-bottom:.5rem }
  /* folding slides: the body's one grid row goes from its height to 0 */
  .card .body { display:grid; grid-template-rows:1fr; transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1), opacity .25s }
  .card .body > .bi { min-height:0; overflow:hidden; animation:fade .22s ease-out }
  .card.fold .body { grid-template-rows:0fr; opacity:0 } .card.still .body { transition:none }
  .card.enter { animation:cardin .4s cubic-bezier(.2,.8,.2,1) both }
  .livewrap > .trail:not(.old) { animation:cardin .35s cubic-bezier(.2,.8,.2,1) both }
  .m.enter { animation:cardin .35s cubic-bezier(.2,.8,.2,1) both }
  .trail li.old { animation:none } .trail li.done-now .tile { animation:pop .3s cubic-bezier(.3,1.6,.5,1) both }
  .trail.done.open ol { animation:fade .25s ease-out }
  @keyframes cardin { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes pop { from { transform:scale(.4); opacity:0 } to { transform:none; opacity:1 } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important } }
  .pg { position:relative } .pg img { display:block; width:100% }
  .hl { position:absolute; background:rgba(255,210,0,.38); border-radius:3px; mix-blend-mode:multiply }
  .card:not(.fold) .hl, #ev .hl { animation:pulse 1.2s ease-out 1 }
  @keyframes pulse { 0% { background:rgba(255,170,0,.75) } 100% { background:rgba(255,210,0,.38) } }
  /* full page viewer: opened from a card */
  #ev { position:fixed; inset:auto 0 0 0; height:88vh; display:flex; flex-direction:column; background:#fff; border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(20,30,60,.25); z-index:10 }
  #ev[hidden] { display:none }
  @media (min-width:700px) { #ev { left:50%; right:auto; width:600px; transform:translateX(-50%) } }  /* desktop: a phone-width sheet, not a wall of page */
  #ev .bar { display:flex; align-items:center; gap:.4rem; padding:.55rem .7rem; font-size:14px; border-bottom:1px solid var(--line) }
  #evmode { font-weight:700; font-size:12.5px; letter-spacing:.03em }
  #ev .bar .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } #ev .bar .t b { color:var(--blue) }

  if (keys.slice(0, shown.length).some((k, i) => k !== shown[i])) { log.querySelectorAll(":scope > :not(#intro)").forEach(e => e.remove()); shown = []; typingEl = null; pendingEl = null; photoSigs = []; }  // history changed: redraw
  const start = shown.length, added = msgs.slice(start);
  msgs.slice(0, start).forEach((m, i) => {
    if (!(m.media || []).length || photoSigs[i] === photoSig(m)) return;
    const el = log.querySelector(`.m[data-mi="${i}"]`);
    if (el) el.outerHTML = msgHtml(m, i);
    photoSigs[i] = photoSig(m);
  });
  const steps = (d.activity && d.activity.steps) || [];
  const live = waiting || steps.length;
  liveMsg = {ev: (d.activity && d.activity.sources) || []};
  const sig = live ? JSON.stringify(steps) + JSON.stringify(liveMsg.ev) : "";
  if (typingEl && (added.length || sig !== liveSig || !live)) { typingEl.remove(); typingEl = null; }
  if (live && (sig !== liveSig || !phaseAt)) {  // the oldest line still running, or the reply once none is
    const run = running(steps);
    const key = run.size ? "s" + Math.min(...run) : "w" + steps.length;
    if (key !== phaseKey) { phaseKey = key; phaseAt = Date.now(); }
  }
  if (!live) { phaseAt = 0; phaseKey = ""; liveDrawn = {n: 0, run: new Set(), tail: false, card: false}; }
  if (added.length) {
    // the traveler's words, shown at once on send, give way to the stored message (without sliding in twice)
    const echo = pendingEl && added.some(m => m.direction === "in");
    if (echo) { pendingEl.remove(); pendingEl = null; }
    // what was checked, the sources, then the reply under them: the order they appeared in while it was written
    const first = log.querySelectorAll(":scope > .m").length;
    log.insertAdjacentHTML("beforeend", added.map((m, j) => (m.steps ? `<div class="trail done">${trailHtml(m.steps, false)}</div>` : "")
      + (m.ev ? cardHtml(m, start + j) : "") + msgHtml(m, start + j)).join(""));
    if (start) [...log.querySelectorAll(":scope > .m")].slice(first).forEach(e => { if (!(echo && e.classList.contains("in"))) e.classList.add("enter"); });  // not on page load
    // applyFolds opens the right one; a card taking the live card's place opens without sliding again
    log.querySelectorAll(".card").forEach(c => { if (+c.dataset.i >= start) c.classList.add("fold", "still"); });
    requestAnimationFrame(() => requestAnimationFrame(() => log.querySelectorAll(".card.still").forEach(c => c.classList.remove("still"))));
    shown = keys;
    msgs.forEach((m, i) => { if (photoSigs[i] === undefined) photoSigs[i] = photoSig(m); });
  }
  applyFolds();
  if (live && !typingEl) {  // one row per step, appearing as the agent works
    typingEl = Object.assign(document.createElement("div"), {className: "livewrap",
      innerHTML: `<div class="trail${liveDrawn.n || liveDrawn.tail ? " old" : ""}">${trailHtml(steps, true)}</div>` + (liveMsg.ev.length ? cardHtml(liveMsg, "live") : "")});
    log.append(typingEl);
    const card = typingEl.querySelector(".card");
    if (card && !liveDrawn.card) card.classList.add("enter");
    liveDrawn.card = !!card;
    if (card) selectSource(card, liveMsg.ev.at(-1).n);  // the source just cited
    log.scrollTop = log.scrollHeight;
  }
  liveSig = sig;
  const el = typingEl && typingEl.querySelector(".el"), secs = Math.floor((Date.now() - phaseAt) / 1000);
  if (el) el.textContent = secs >= 3 ? ` · ${T.secs(secs)}` : "";
  if (added.length) log.scrollTop = log.scrollHeight;
  sync();
}

// Sending never loses what the traveler typed or picked: on failure it comes back with a "try again" line.
let pendingEl = null;
async function post(body) {
  waiting = outCount() + 1;  // also when the chat has no message from us yet (a link opened before any alert)
  if (body.text && !body.images) {  // the words appear the moment they are sent, above "working…", not after the server's echo
    if (pendingEl) pendingEl.remove();
    pendingEl = Object.assign(document.createElement("div"), {className: "m in enter pending", textContent: body.text});
    if (typingEl) log.insertBefore(pendingEl, typingEl); else log.append(pendingEl);
    log.scrollTop = log.scrollHeight;
  }
  refresh();
  let ok = false;
  try {
    const r = await fetch(base + "/send", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({client_id: crypto.randomUUID(), ...body})});
    ok = r.ok;
  } catch (e) { ok = false; }
  if (!ok) { waiting = 0; if (pendingEl) { pendingEl.remove(); pendingEl = null; } }  // the text goes back into the box
  setTimeout(refresh, 600);
  return ok;
}
function sendFailed(retry) {
  log.querySelectorAll(".sendfail").forEach(x => x.remove());
  const el = Object.assign(document.createElement("div"), {className: "sendfail", innerHTML: `${ic("alert")} ${T.failed}<button type="button">${ic("retry")} ${T.retry}</button>`});
  el.querySelector("button").onclick = () => { el.remove(); retry(); };
  log.append(el); log.scrollTop = log.scrollHeight;
}
const offline = document.getElementById("offline");
const net = () => { offline.hidden = navigator.onLine; offline.innerHTML = ic("wifioff") + " " + T.offline; };
addEventListener("online", net); addEventListener("offline", net); net();

// Checklist sheet (header "서류 3/6 ▾") and the submit button once everything is in.
let claimState = null;
const cl = document.getElementById("cl");
// Receipt by receipt: "ベイサイド… ¥16,500 → $110.00", with the rate, so the traveler can check the sum
// the phone's time zone as people read it: "UTC−7" (and the place name when the browser knows it)
// Korean: compared with Korea ("한국·일본과 같은 시간", "한국보다 16시간 늦어요"); English: the offset ("UTC−7")
const tzLabel = () => { const o = -new Date().getTimezoneOffset(), d = (o - 540) / 60, h = Math.abs(d);
  if (CFG.locale === "ko") return o === 540 ? "한국·일본과 같은 시간" : `한국보다 ${Number.isInteger(h) ? h : h.toFixed(1)}시간 ${d < 0 ? "늦어요" : "빨라요"}`;
  return `UTC${o < 0 ? "−" : "+"}${Math.floor(Math.abs(o) / 60)}${Math.abs(o) % 60 ? ":" + String(Math.abs(o) % 60).padStart(2, "0") : ""}`; };
const money = (cur, n) => cur === "JPY" ? `¥${(+n).toLocaleString()}` : `${esc(cur)} ${(+n).toLocaleString()}`;
const estRows = e => {
  const rows = (e.rows || []).filter(r => r.total);
  if (!rows.length) return "";
  const fx = rows.find(r => r.per_usd && r.currency !== "USD");
  return `<details class="er"><summary>${T.estBreak(rows.length)}</summary>${rows.map(r => `<div><span>${esc(r.merchant || "")}</span>
    <span>${money(r.currency, r.total)} → ${r.excluded && r.excluded.length ? `<s>$${(+r.usd || 0).toFixed(2)}</s> ${T.estOut}` : `$${(+r.counted_usd).toFixed(2)}`}</span></div>`).join("")}
    ${fx ? `<small>${T.estRate(fx.per_usd, fx.currency)}</small>` : ""}</details>`;
};
let cbOpen = null;  // the call-time choices are open ({change: true} when they change a time staff set)
function drawChecklist() {
  const d = claimState; if (!d || !d.items) return;
  document.getElementById("pl").textContent = T.docsN(d.done, d.total);
  const complete = d.done === d.total, submitted = ["submitted", "approved", "denied"].includes(d.status);
  const ready = document.getElementById("ready");
  ready.hidden = !complete && !submitted;
  ready.classList.toggle("sent", submitted);
  document.getElementById("readyt").innerHTML = ic(d.status === "denied" ? "alert" : "done") + " " + (!submitted ? T.ready
    : d.decision ? T.decided(d) : T.sentLine(d));
  document.getElementById("readyb").textContent = submitted ? T.details : T.submit;
  document.getElementById("clt").textContent = d.decision ? T.clTitleDecided : T.clTitle;  // after a decision this is where the result lives
  const e = d.estimate || {};
  const dec = d.decision ? `<div class="est ${d.decision.type === "deny" ? "deny" : ""}"><div class="el">${T.decTitle}</div><div class="ev">${d.decision.type === "deny" ? T.decDeny
      : `$${(+d.decision.amount_usd).toFixed(2)}<small>${T.estKrw(Math.round(d.decision.amount_usd * (e.krw_per_usd || 1380)))}</small>`}</div>
      ${(d.decision.lines || []).map(l => `<div class="es">${esc(l.merchant || "")}: $${(+l.from).toFixed(2)} → <b>$${(+l.to).toFixed(2)}</b> (${esc((T.adj || {})[l.reason] || l.reason)})</div>`).join("")}
      <div class="es">${d.decision.type === "partial" ? T.decLess(e) : d.decision.type === "deny" ? T.decWhy : ""}</div>
      ${d.decision.appeal ? `<div class="es appealed">${ic("done")} ${d.decision.appeal.resolved ? T.appealDone : T.appealed(dueDate(d.decision.appeal.reply_by))}</div>
        ${!d.decision.appeal.resolved ? (() => { const a = d.decision.appeal;
          const n = msgs.filter(m => m.direction === "in" && (m.at || "") > (a.at || "~")).reduce((k, m) => k + (m.media || []).length, 0);
          return `<div class="es myap"><b>${T.myAppeal}</b> “${esc(a.text || "")}”${n ? `<br>${ic("image")} ${T.evN(n)}` : ""}</div>
          <button type="button" class="letter" id="apev">${ic("image")} ${T.apEv}</button>
          <button type="button" class="wbtn" id="apwd">${T.withdraw}</button>`; })() : ""}
        ${!d.decision.appeal.resolved && d.decision.type === "partial" ? `<div class="es split">${T.splitLine(d, Math.max(0, d.decision.estimate_usd - d.decision.amount_usd).toFixed(2))}</div>` : ""}<div class="es">${T.fss}</div>`
        : d.decision.appeal_by ? `<div class="es">${T.appealBy(dueDate(d.decision.appeal_by))}</div>
          <div class="appeal"><button type="button" class="bigbtn" id="apb">${T.appealBtn}</button>
            <a class="callbtn" href="tel:${esc((CFG.insurer || {}).tel || (CFG.insurer || {}).phone || "")}">${ic("phone")} ${T.callShort} ${esc((CFG.insurer || {}).phone || "")}</a>
            <div id="apf" hidden><textarea id="apt" rows="3" placeholder="${esc(T.appealPh)}"></textarea><small id="apm" class="w" hidden></small>
              <button type="button" class="bigbtn" id="aps">${T.appealSend}</button></div></div>` : ""}
      <a class="letter" href="${base}/decision" target="_blank" rel="noreferrer">${ic("file")} ${T.letter}</a></div>` : "";
  const est = dec || (e.covered && e.receipts_usd ? `<div class="est"><div class="el">${T.estTitle}</div><div class="ev">$${(+e.estimate_usd).toFixed(2)}<small>${T.estKrw(e.estimate_krw)}</small></div>
      <div class="es">${T.estDetail(e)}</div>${estRows(e)}<div class="es">${T.estNote}</div></div>` : "");
  const apt = document.getElementById("apt"), draft = apt && !document.getElementById("apf").hidden ? apt.value : null;  // keep a half-typed objection
  document.getElementById("clb").innerHTML = est + d.items.map(it => `<div class="ci ${it.done ? "done" : ""}"><span class="b">${it.done ? ic("check") : ""}</span><div>${esc(it.label)}
      ${it.retake ? `<small class="w">${ic("alert")} ${T.retakeN(it.retake)}</small>` : ""}
      ${!it.done && it.check ? `<small class="w">${ic("alert")} ${(it.why || []).length ? it.why.map(w => T.why[w] || "").join(" ") + " " + (it.key === "expense_receipts" ? T.why.fixReceipt : T.why.fix) : T.checkN}</small>` : ""}
      ${!it.done ? (it.secure ? `<small>${T.secureHint}</small><a href="${base}/secure" rel="noreferrer">${ic("lock")} ${T.securePage}</a>` : `<small>${T.sendHint}</small>`) : ""}</div></div>`).join("")
    + (submitted ? `<p class="clnote"><span class="ok">${ic("done")}</span> ${d.decision ? "" : T.submitted}${d.due ? `${d.decision ? "" : "<br>"}${T.dueLine(d.due)}` : ""}${d.payout ? `<br>${T.payto}: ${esc(d.payout.bank)} •••${esc(d.payout.account_last4)}` : ""}</p>`
       : `<button type="button" class="bigbtn" id="subm" ${complete ? "" : "disabled"}>${T.submit}</button>${complete ? "" : `<p class="clnote">${T.notYet}</p>`}`)
    + `<div class="callreq"><button type="button" id="cbr" ${d.callback ? "disabled" : ""}>${ic("phone")} ${d.callback ? T.callReqDone : T.callReq}</button><div class="cbw" id="cbw" hidden><small>${T.callWhen(tzLabel())}</small>${["any", "am", "pm"].map(p => `<button type="button" data-p="${p}">${T["call" + p[0].toUpperCase() + p.slice(1)]}</button>`).join("")}</div>${d.callback && d.callback.due ? `<small class="cbwhen">${ic("clock")} ${T.callAt(new Date(d.callback.due))}${CFG.insurer && CFG.insurer.phone ? `<br>${esc(T.callFrom(CFG.insurer.phone))}` : ""}</small>` : ""}${d.callback && !d.callback.requested
      ? (d.callback.change_requested ? `<small>${T.callChangeSent}</small>` : `<button type="button" class="cbx" id="cbch">${T.callChange}</button>`) : ""}${d.callback && d.callback.requested ? `<button type="button" class="cbx" id="cbx">${T.callCancel}</button>` : ""}<small>${T.callReqHint}</small></div>`
    + langSwitch();
  const sb = document.getElementById("subm"); if (sb) sb.onclick = submitClaim;
  const apwd = document.getElementById("apwd");  // two taps, no pop-up: the first one says what happens
  if (apwd) apwd.onclick = async () => { if (!apwd.dataset.sure) { apwd.dataset.sure = "1"; apwd.textContent = T.withdrawSure; return; }
    apwd.disabled = true; const r = await fetch(base + "/appeal_withdraw", {method: "POST", headers: {"content-type": "application/json"}, body: "{}"}).catch(() => null);
    if (r && r.ok) refresh(); else apwd.disabled = false; };
  const ap = d.decision && d.decision.appeal;  // earlier notices: say the objection is already in
  document.querySelectorAll(".apnote").forEach(n => { n.hidden = !(ap && !ap.resolved); if (ap && !ap.resolved) n.textContent = T.apNote(dueDate(ap.reply_by)); });
  const apev = document.getElementById("apev");  // evidence for the objection: same photo path, labelled for the reviewer
  if (apev) apev.onclick = () => { cl.hidden = true; if (!ta.value.trim()) { ta.value = T.apEvText; sync(); } document.getElementById("file").click(); };
  const cbr = document.getElementById("cbr");  // abroad, a call to Korea costs: ask the insurer to call instead
  const cbx = document.getElementById("cbx");  // changed plans: take the request back (staff see it go)
  if (cbx) cbx.onclick = async () => { cbx.disabled = true;
    const r = await fetch(base + "/callback", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({cancel: true})}).catch(() => null);
    if (r && r.ok) { claimState.callback = null; refresh(); } else cbx.disabled = false; };
  const cbch = document.getElementById("cbch");  // a time staff set does not suit: pick a window, staff set a new time
  const cbw = document.getElementById("cbw");  // first tap: pick a window in the traveler's own time; the server finds the slot
  // the sheet is redrawn on every refresh: the open choices (and whether they change a staff time) survive it
  if (cbw && cbOpen) { cbw.hidden = false; if (cbOpen.change) cbw.dataset.change = "1"; }
  if (cbch) cbch.onclick = () => { cbOpen = cbOpen ? null : {change: true}; cbw.dataset.change = "1"; cbw.hidden = !cbOpen; };
  if (cbr) cbr.onclick = () => { cbOpen = cbOpen ? null : {change: false}; delete cbw.dataset.change; cbw.hidden = !cbOpen; };
  if (cbw) cbw.onclick = async e => { const b = e.target.closest("button"); if (!b) return;
    cbw.querySelectorAll("button").forEach(x => x.disabled = true); cbr.disabled = true;
    const body = JSON.stringify({pref: b.dataset.p, offset_min: -new Date().getTimezoneOffset(), change: !!cbw.dataset.change});
    const r = await fetch(base + "/callback", {method: "POST", headers: {"content-type": "application/json"}, body}).catch(() => null);
    if (r && r.ok) { cbOpen = null; claimState.callback = cbw.dataset.change ? {...claimState.callback, change_requested: true} : {requested: true}; cbw.hidden = true; cbr.innerHTML = ic("phone") + " " + T.callReqDone; refresh(); }
    else { cbr.disabled = false; cbw.querySelectorAll("button").forEach(x => x.disabled = false); } };
  const apb = document.getElementById("apb");  // objection: say why in a sentence; it goes to a different reviewer
  if (apb && draft !== null) { apb.hidden = true; document.getElementById("apf").hidden = false; document.getElementById("apt").value = draft; }
  if (apb) apb.onclick = () => { document.getElementById("apf").hidden = false; apb.hidden = true; document.getElementById("apt").focus(); };
  const aps = document.getElementById("aps");
  if (aps) aps.onclick = async () => {  // say what happened every time: too short, sending, failed, sent
    const text = document.getElementById("apt").value.trim(), msg = document.getElementById("apm");
    const show = t => { msg.textContent = t; msg.hidden = !t; };
    if (text.length < 5) return show(T.appealShort);
    aps.disabled = true; aps.textContent = T.sending; show("");
    try {
      const r = await fetch(`${base}/appeal`, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({text})});
      if (!r.ok) throw new Error(r.status);
      refresh();
    } catch (e) {
      show(navigator.onLine ? T.appealFailed : T.offline);
    } finally { aps.disabled = false; aps.textContent = T.appealSend; }
  };
}
// A question inside the page (a sheet from the bottom), not the browser's confirm box: same look as the chat,
// in the traveler's language, and it stays inside the phone when the chat is shown in a frame.
function ask(text, yes, no) {
  const d = document.getElementById("askd");
  document.getElementById("askt").textContent = text;
  const y = document.getElementById("asky"), n = document.getElementById("askn");
  y.textContent = yes; n.textContent = no;
  return new Promise(res => {
    const done = v => { d.onclose = null; d.close(); res(v); };
    y.onclick = () => done(true); n.onclick = () => done(false); d.onclose = () => res(false);
    d.showModal(); y.focus();
  });
}
async function submitClaim() {
  const left = (claimState.items || []).reduce((n, it) => n + (it.retake || 0), 0);  // photos still waiting for a retake
  if (!await ask(left ? T.submitAskRetake(left) : T.submitAsk, T.askYes, T.askNo)) return;
  cl.hidden = true;
  waiting = outCount() + 1;
  try { await fetch(base + "/submit", {method: "POST"}); } catch (e) { waiting = 0; sendFailed(submitClaim); }
  refresh();
}
document.getElementById("prog").onclick = () => { drawChecklist(); cl.hidden = !cl.hidden; };
document.getElementById("clx").onclick = () => cl.hidden = true;
document.getElementById("readyb").onclick = () => claimState && ["submitted", "approved", "denied"].includes(claimState.status) ? (drawChecklist(), cl.hidden = false) : submitClaim();

// Composer: text grows with the content, photos wait as thumbnails until Send, suggestions until the first question.
const send = document.getElementById("send"), thumbs = document.getElementById("thumbs"), chips = document.getElementById("chips");
let pending = [];  // [{file, url}]
const sync = () => {
  ta.style.height = "auto"; ta.style.height = (ta.value ? Math.min(ta.scrollHeight, 132) : 40) + "px";  // placeholder never adds lines
  send.disabled = !ta.value.trim() && !pending.length;
  chips.hidden = !!ta.value.trim() || pending.length > 0 || msgs.some(m => m.direction === "in");
};
ta.addEventListener("input", sync);
chips.innerHTML = (T.chips || []).map(c => `<button type="button">${esc(c)}</button>`).join("");
chips.onclick = e => { const b = e.target.closest("button"); if (b) { post({text: b.textContent}); chips.hidden = true; } };
function drawThumbs() {
  thumbs.innerHTML = pending.map((p, i) => `<div class="th" style="background-image:url('${p.url}')"><button type="button" data-i="${i}" aria-label="${T.remove}">${ic("x")}</button></div>`).join("");
  sync();
}
thumbs.onclick = e => { const b = e.target.closest("button"); if (!b) return; URL.revokeObjectURL(pending[+b.dataset.i].url); pending.splice(+b.dataset.i, 1); drawThumbs(); };
document.getElementById("cam").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = e => {
  for (const file of [...e.target.files].slice(0, 8 - pending.length)) pending.push({file, url: URL.createObjectURL(file)});
  e.target.value = ""; drawThumbs(); ta.focus();
};
async function shrink(file) {  // 1600 px JPEG on the phone before upload
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement("canvas"), {width: Math.round(img.width * scale), height: Math.round(img.height * scale)});
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return {data: c.toDataURL("image/jpeg", 0.85).split(",")[1], mime: "image/jpeg", filename: file.name || "photo.jpg"};
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const text = ta.value.trim(), files = pending;
  if (!text && !files.length) return;
  pending = []; ta.value = ""; drawThumbs();
  const restore = (textBack = text) => {  // put everything back so nothing has to be typed or picked again
    if (!ta.value) ta.value = textBack;
    pending = [...files, ...pending]; drawThumbs();
    sendFailed(() => document.getElementById("f").requestSubmit());
  };
  if (!files.length) { if (!(await post({text}))) restore(); return; }
  const images = await Promise.all(files.map(p => shrink(p.file)));
  for (let k = 0; k < files.length; k += 4) localQueue.push(files.slice(k, k + 4).map(p => p.url));  // shown until read
  let sentText = text;
  for (let k = 0; k < images.length; k += 4) {  // request size limit
    if (!(await post({text: sentText, images: images.slice(k, k + 4)}))) { files.splice(0, k); restore(k ? "" : text); return; }
    sentText = "";
  }
};
ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && innerWidth >= 700) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
(function loop() { refresh().finally(() => setTimeout(loop, waiting || liveSig ? 900 : 2500)); })();
</script>
