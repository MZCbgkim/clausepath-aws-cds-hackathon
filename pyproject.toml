[project]
name = "tripclaim"
version = "0.1.0"
description = "Agentic travel-claim concierge on AWS Communication Developer Services"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "boto3>=1.40",
  "strands-agents>=1.50",
  "bedrock-agentcore>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
local = ["claude-agent-sdk>=0.2.165"]   # LLM_BACKEND=sdk; never in the Lambda packages
infra = ["aws-cdk-lib>=2.250", "constructs>=10"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tripclaim = ["prompts/*.md", "prompts/*.json", "web/*.html", "web/docs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
